<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" role="img">
  <title>Lattice</title>
  <desc>Lattice — a modal, GPU-accelerated, plugin-first text editor in Rust</desc>
  <rect fill="#0d1117" x="0" y="0" width="480" height="100" rx="6"/>
  <g transform="translate(24, 22) scale(0.308)">
    <path d="M 0 20 L 20 20 L 20 100 L 80 100 L 80 120 L 0 120 Z" fill="#58a6ff"/>
    <path d="M 20 0 L 100 0 L 100 100 L 80 100 L 80 20 L 20 20 Z" fill="#58a6ff"/>
    <rect x="40" y="36" width="20" height="48" fill="#f59e0b">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.65;0.65;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="63" y="59"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="52" font-weight="500" letter-spacing="-1.5" fill="#58a6ff">Lattice</text>
  <text x="63" y="81"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="14" font-weight="400" letter-spacing="0.3" fill="#8b949e">A modal, GPU-accelerated, plugin-first text editor in Rust</text>
</svg>
